name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ls -la
          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then echo "ERROR: repo me koi .zip file nahi mili. Pehle zip upload karo."; exit 1; fi
          echo "Using $ZIP"
          mkdir -p proj
          unzip -q "$ZIP" -d proj
          ROOT=$(dirname "$(find proj -name settings.gradle.kts | head -n 1)")
          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create signing keystore
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build release APK
        working-directory: ${{ env.ROOT }}
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HyperGet-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/release/*.apk
